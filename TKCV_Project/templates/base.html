<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Home{% endblock %} · TKCV Exams</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="floor" aria-hidden="true"></div>
  <header class="top">
    <a class="brand" href="{{ url_for('home') }}"><span class="brand-cube"></span>TKCV Exams</a>
    <nav>
      {% if session.get('admin_id') %}
        <a href="{{ url_for('dashboard') }}">My exams</a>
        <a href="{{ url_for('exam_new') }}">New exam</a>
        <form method="post" action="{{ url_for('admin_logout') }}" style="margin:0">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button class="linkbtn" type="submit">Sign out</button>
        </form>
      {% else %}
        <a href="{{ url_for('student_login') }}">Student</a>
        <a href="{{ url_for('admin_login') }}">Admin</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in msgs %}<div class="flash {{ cat }}" role="status">{{ msg }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script>
    // gentle 3-D tilt on cards that have the "tilt" class
    document.querySelectorAll('.tilt').forEach(function (el) {
      el.addEventListener('mousemove', function (e) {
        var r = el.getBoundingClientRect();
        var x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
        el.style.setProperty('--ry', (x * 6) + 'deg');
        el.style.setProperty('--rx', (-y * 6) + 'deg');
      });
      el.addEventListener('mouseleave', function () {
        el.style.setProperty('--rx', '0deg'); el.style.setProperty('--ry', '0deg');
      });
    });
    // stop double submits
    document.querySelectorAll('form').forEach(function (f) {
      f.addEventListener('submit', function () {
        var b = f.querySelector('button[type=submit]');
        if (b) setTimeout(function () { b.disabled = true; }, 0);
      });
    });
  </script>
</body>
</html>
