{% extends "base.html" %}
{% block title %}Set new password{% endblock %}
{% block content %}
<section class="auth">
  <form class="card stack" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <h2>Set a new password</h2>
    <label>New password (8+ characters)<input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
    <label>Confirm password<input type="password" name="confirm" required minlength="8" autocomplete="new-password"></label>
    <button class="btn" type="submit">Update password</button>
  </form>
</section>
{% endblock %}
