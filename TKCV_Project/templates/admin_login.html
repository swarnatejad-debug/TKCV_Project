{% extends "base.html" %}
{% block title %}Admin sign in{% endblock %}
{% block content %}
<section class="auth">
  <form class="card stack" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <h2>Admin sign in</h2>
    <label>Gmail address<input type="email" name="email" required autocomplete="email"></label>
    <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn" type="submit">Sign in</button>
    <p class="sub" style="margin:0"><a href="{{ url_for('admin_forgot') }}">Forgot password?</a> · <a href="{{ url_for('admin_register') }}">Create an account</a></p>
  </form>
</section>
{% endblock %}
