{% extends "base.html" %}
{% block title %}Create admin account{% endblock %}
{% block content %}
<section class="auth">
  <form class="card stack" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <h2>Create admin account</h2>
    <label>Gmail address<input type="email" name="email" required placeholder="you@gmail.com" autocomplete="email"></label>
    <label>Password (8+ characters)<input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
    <label>Confirm password<input type="password" name="confirm" required minlength="8" autocomplete="new-password"></label>
    {% if needs_code %}
    <label>Invite code<input name="invite" required autocomplete="off"></label>
    {% endif %}
    <button class="btn" type="submit">Create account</button>
    <p class="sub" style="margin:0">Already registered? <a href="{{ url_for('admin_login') }}">Sign in</a></p>
  </form>
</section>
{% endblock %}
